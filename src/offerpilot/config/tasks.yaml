research_company:
  description: >
    Read this job posting and produce a company and role brief.

    JOB POSTING:
    {job_posting}

    Use your tools to look up the company: its website, products, and recent
    news. Cite the URLs you used. Cover: what the company does, what the team likely works on, the top 5
    required skills, nice-to-haves, and keywords the application should use.
  expected_output: >
    A markdown brief with sections: Company, Role, Top Skills, Nice-to-haves,
    Keywords, Sources.

tailor_resume:
  description: >
    Rewrite the candidate's resume for the job posting below.
    Reorder and rephrase bullets to match the role's requirements and keywords.
    Do NOT invent jobs, skills, metrics, or dates.

    JOB POSTING:
    {job_posting}

    ORIGINAL RESUME:
    {resume}
  expected_output: >
    The full tailored resume in markdown, followed by a short "Changes made" list.

write_cover_letter:
  description: >
    Write a cover letter for this role using the company brief and the
    tailored resume. Keep it under 350 words, specific to this company,
    and grounded only in the candidate's real experience.
  expected_output: >
    A cover letter in markdown, ready to send.

review_application:
  description: >
    You are reviewing a job application draft (round {review_round}).
    Compare the tailored resume and cover letter against the ORIGINAL resume
    and the job posting. Flag any invented claims, missing important keywords,
    generic phrasing, or tone issues. Approve only if there are no invented
    claims and the score is 8 or higher.

    JOB POSTING:
    {job_posting}

    ORIGINAL RESUME:
    {resume}

    TAILORED RESUME:
    {tailored_resume}

    COVER LETTER:
    {cover_letter}
  expected_output: >
    A verdict (APPROVED or NEEDS_CHANGES), a score out of 10, a one-paragraph
    summary, and separate lists of specific, actionable issues for the resume
    and for the cover letter (empty lists if none).

revise_resume:
  description: >
    A reviewer flagged issues with the tailored resume. Fix every issue below
    and return the complete revised resume. Use only facts from the ORIGINAL
    resume. If the list is empty, return the tailored resume unchanged.

    ISSUES:
    {resume_issues}

    ORIGINAL RESUME:
    {resume}

    CURRENT TAILORED RESUME:
    {tailored_resume}
  expected_output: >
    The complete revised resume in markdown, and nothing else.

revise_cover_letter:
  description: >
    A reviewer flagged issues with the cover letter. Fix every issue below and
    return the complete revised letter, consistent with the revised resume.
    If the list is empty, return the cover letter unchanged.

    ISSUES:
    {cover_letter_issues}

    CURRENT COVER LETTER:
    {cover_letter}
  expected_output: >
    The complete revised cover letter in markdown, and nothing else.
