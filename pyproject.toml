[project]
name = "offerpilot"
version = "0.1.0"
description = "A multi-agent job application assistant built with CrewAI."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[anthropic]==1.15.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
offerpilot = "offerpilot.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/offerpilot"]
